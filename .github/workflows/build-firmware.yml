name: Firmware Build

on:
  push:
    branches: [main, 1.0-dev, 2.0-dev]
    paths:
      - '.github/workflows/build-firmware.yml'
      - 'src/**'
      - 'test/**'
      - 'include/**'
      - 'platformio.ini'
      - 'sdkconfig.*'
      - 'boards/**'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - '.github/workflows/build-firmware.yml'
      - 'src/**'
      - 'test/**'
      - 'include/**'
      - 'platformio.ini'
      - 'sdkconfig.*'
      - 'boards/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Unit tests (native)
        run: pio test -e native

      - name: Build C3SuperMini
        run: pio run -e C3SuperMini

      - name: Build C3SuperMini (NimBLE)
        run: pio run -e C3SuperMini_nimble

      - name: Package Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/*/*.bin
          retention-days: 60
          if-no-files-found: error
