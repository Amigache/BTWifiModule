name: Web Flasher

on:
  push:
    branches: [main, develop]
    paths:
      - 'webflash/**'
      - 'src/**'
      - 'platformio.ini'
      - 'sdkconfig.*'
      - 'boards/**'
      - 'CMakeLists.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build C3SuperMini (Bluedroid)
        run: pio run -e C3SuperMini

      - name: Build C3SuperMini (NimBLE)
        run: pio run -e C3SuperMini_nimble

      - name: Assemble web flasher
        run: |
          mkdir -p webflash/firmware/bluedroid webflash/firmware/nimble
          cp .pio/build/C3SuperMini/bootloader.bin \
             .pio/build/C3SuperMini/partitions.bin \
             .pio/build/C3SuperMini/firmware.bin \
             webflash/firmware/bluedroid/
          cp .pio/build/C3SuperMini_nimble/bootloader.bin \
             .pio/build/C3SuperMini_nimble/partitions.bin \
             .pio/build/C3SuperMini_nimble/firmware.bin \
             webflash/firmware/nimble/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webflash

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
