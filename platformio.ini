; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Primary development target.
default_envs = C3SuperMini

; Common configuration for all ESP32 targets (ESP-IDF).
; espressif32@6.10.0 == ESP-IDF v5.4.0 (matches the repo's sdkconfig.* files).
[esp32]
platform = espressif32@6.10.0
framework = espidf
; Drop -Werror=all so warnings do not break the build (the code is kept
; warning-free regardless).
build_unflags = -Werror=all

; ---------------------------------------------------------------------------
; ESP32 (original Pico Kit)
; ---------------------------------------------------------------------------
[env:pico32_debug]
extends = esp32
upload_protocol = esptool
upload_port = COM41
board = pico32_cust
debug_tool = esp-prog
debug_speed = 6000
debug_init_break = tbreak app_main
board_build.partitions = pico_partitions.csv
build_type = debug
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_PICO=y
    -DCPU_ESP32=y

[env:pico32]
extends = esp32
board = pico32_cust
upload_protocol = esptool
monitor_speed = 115200
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_PICO=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y

; ---------------------------------------------------------------------------
; ESP8285 (Happymodel EP82) — legacy, does not share the ESP32 tree
; ---------------------------------------------------------------------------
[env:HappymodelEP82]
platform = espressif8266
board = esp8285
board_build.ldscript = eagle.flash.1m144.ld
upload_speed = 921600
monitor_speed = 115200
board_build.f_cpu = 160000000L
upload_protocol = esptool
upload_port = COM6
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_HMEP82=y
    -DCPU_ESP8285=y
    -DSBUS_IN=y

; ---------------------------------------------------------------------------
; ESP32 WROOM (Node32s)
; ---------------------------------------------------------------------------
[env:Node32s_Wroom32]
extends = esp32
board = node32s
upload_protocol = esptool
monitor_speed = 115200
upload_port = COM4
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_WROOM=y
    -DBLUETOOTH=y
    -DCPU_ESP32=y

; ---------------------------------------------------------------------------
; ESP32-C3 DevKitM-1
; ---------------------------------------------------------------------------
[env:C3Mini]
extends = esp32
board_build.flash_mode: dio
board = esp32-c3-devkitm-1
upload_protocol = esptool
build_type = debug
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_C3MINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y

[env:C3Mini_2]
extends = esp32
board_build.flash_mode: dio
board = esp32-c3-devkitm-1
upload_protocol = esptool
build_type = debug
monitor_speed = 115200
upload_port = COM18
monitor_port = COM18
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_C3MINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y

; ---------------------------------------------------------------------------
; Radiomaster Pico
; ---------------------------------------------------------------------------
[env:RM_pico]
extends = esp32
board = pico32_cust
upload_protocol = esptool
monitor_speed = 115200
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_RMPICO=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini (primary target)
; ---------------------------------------------------------------------------
[env:C3SuperMini]
extends = esp32
board_build.flash_mode: dio
board = esp32-c3-devkitm-1
board_build.esp-idf.sdkconfig_path = sdkconfig.C3SuperMini
upload_protocol = esptool
; The ESP32-C3 SuperMini's native USB (USB Serial JTAG) does not support the
; DTR/RTS reset sequence (board_upload.before_reset = usb_reset) and its stub
; fails on some revisions (--no-stub). After flashing, press RESET (or re-plug
; the USB) to run the app, since after_reset is set to no_reset.
board_upload.before_reset = usb_reset
board_upload.after_reset = no_reset
upload_flags =
    --no-stub
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_C3SUPERMINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y

; NimBLE experimental build (same board, NimBLE host instead of Bluedroid).
[env:C3SuperMini_nimble]
extends = esp32
board_build.flash_mode: dio
board = esp32-c3-devkitm-1
board_build.esp-idf.sdkconfig_path = sdkconfig.C3SuperMini_nimble
upload_protocol = esptool
build_type = debug
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_C3SUPERMINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; Host unit tests. Run with: pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
